  </style>
  <script type="module">
    function clamp(val, min, max) {
      return Math.min(Math.max(val, min), max);
    }

    function getMoodTextColor(val) {
      if (val < 25) return '#e6f7ff';
      if (val < 50) return '#ffa39e';
      if (val < 75) return '#ff4d4f';
      return '#cf1322';
    }

    /* 好感度颜色计算：
       -100 到 0：绿色 rgb(0, 139, 0) 渐变至 灰色 rgb(190, 190, 190)
       0 到 100：灰色 rgb(190, 190, 190) 渐变至 粉红色 rgb(255, 105, 180) */
    function getBondColor(val) {
      const v = clamp(val, -100, 100);
      if (v <= 0) {
        const ratio = (v + 100) / 100;
        const r = Math.round(0 + (190 - 0) * ratio);
        const g = Math.round(139 + (190 - 139) * ratio);
        const b = Math.round(0 + (190 - 0) * ratio);
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      } else {
        const ratio = v / 100;
        const r = Math.round(190 - (190 - 255) * ratio);
        const g = Math.round(190 - (190 - 105) * ratio);
        const b = Math.round(190 - (190 - 180) * ratio);
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      }
    }

    function populateCharacterData() {
      const allVariables = getAllVariables();

      /* 1. 环境信息渲染（当前地点与当前时间） */
      const currentLocation = _.get(allVariables, 'stat_data.当前地点', '未知区域');
      $('#currentlocation-value').text(currentLocation);

      const currentDate = _.get(allVariables, 'stat_data.当前时间', '2099年1月1日 星期四 17:00');
      $('#currentdate-value').text(currentDate);

      /* 2. 资产部分渲染 */
      const coin = _.get(allVariables, 'stat_data.晶币余额', 0);
      $('#coin-value').text(coin);

      const assets = _.get(allVariables, 'stat_data.资产与潜能', []);
      const $assetList = $('#asset-list').empty();
      if (!Array.isArray(assets) || assets.length === 0) {
        $assetList.append($('<li class="empty-hint">').text('暂无资产与潜能'));
      } else {
        assets.forEach(function(item) {
          const name = _.get(item, '名称', '未知资产');
          const type = _.get(item, '类型', '不动产');
          const detail = _.get(item, '详情', '');

          const $li = $('<li class="asset-item"></li>');
          $li.append($('<span class="asset-type-badge"></span>').text(type));
          $li.append($('<span class="asset-name"></span>').text(name));

          /* 如果存在详情，渲染感叹号提示图标，支持点击与悬浮显示描述 */
          if (detail && String(detail).trim() !== '') {
            const $btn = $('<button type="button" class="asset-info-btn" aria-label="查看详情">!</button>');
            const $tooltip = $('<div class="asset-tooltip"></div>').text(detail);
            $btn.append($tooltip);

            $btn.on('click', function(e) {
              e.stopPropagation();
              const wasActive = $(this).hasClass('active');
              $('.asset-info-btn').removeClass('active');
              if (!wasActive) {
                $(this).addClass('active');
              }
            });

            $li.append($btn);
          }

          $assetList.append($li);
        });
      }

      /* 3. 外勤任务渲染逻辑：
         特别逻辑：若任务目标为空或字符数小于5，显示“暂无外勤任务” */
      const missionTarget = _.get(allVariables, 'stat_data.外勤任务.任务目标', '');
      const trimmedTarget = String(missionTarget || '').trim();
      const $missionEmpty = $('#mission-empty');
      const $missionContent = $('#mission-content');

      if (!trimmedTarget || trimmedTarget.length < 5) {
        $missionEmpty.removeAttr('hidden');
        $missionContent.attr('hidden', '');
      } else {
        $missionEmpty.attr('hidden', '');
        $missionContent.removeAttr('hidden');

        $('#mission-target-val').text(trimmedTarget);

        const crystalDepletionTime = _.get(allVariables, 'stat_data.外勤任务.髓晶耗尽时间', '未激活/未知');
        $('#mission-crystal-val').text(crystalDepletionTime);

        const threats = _.get(allVariables, 'stat_data.外勤任务.周边威胁', '无明显异常');
        $('#mission-threat-val').text(threats);

        const supplies = _.get(allVariables, 'stat_data.外勤任务.携带物资', {});
        const $supplyList = $('#mission-supply-list').empty();
        const supplyKeys = Object.keys(supplies || {});

        if (supplyKeys.length === 0) {
          $supplyList.append($('<li class="empty-hint">').text('未携带额外特战物资'));
        } else {
          supplyKeys.forEach(function(key) {
            const detail = supplies[key];
            const $li = $('<li class="supply-item"></li>');
            $li.append($('<span class="supply-name"></span>').text(key));
            if (detail && String(detail).trim() !== '') {
              $li.append($('<span class="supply-detail"></span>').text('(' + detail + ')'));
            }
            $supplyList.append($li);
          });
        }
      }

      /* 4. 羁绊部分渲染：
         -100到0从绿色渐变到灰色，0到100从灰色渐变到粉红；
         负数带负号，正数不带+号 */
      const bonds = _.get(allVariables, 'stat_data.角色好感度', {});
      const $bondsList = $('#bonds-list').empty();
      const bondKeys = Object.keys(bonds);
      if (bondKeys.length === 0) {
        $bondsList.append($('<li class="empty-hint">').text('暂无羁绊联结'));
      } else {
        bondKeys.forEach(function(charName) {
          const rawVal = bonds[charName];
          const val = typeof rawVal === 'number' ? rawVal : 0;
          const clampedVal = clamp(val, -100, 100);
          const pct = ((clampedVal + 100) / 200) * 100;
          const bondColor = getBondColor(clampedVal);

          const $li = $('<li class="bond-item"></li>');
          const $header = $('<div class="bond-header"></div>');
          $header.append($('<span class="bond-name"></span>').text(charName));

          const $valSpan = $('<span class="bond-val"></span>')
            .text(String(clampedVal))
            .css('color', bondColor);
          $header.append($valSpan);

          const $barBg = $('<div class="bond-progress-bg"></div>');
          const $bar = $('<div class="bond-progress-bar"></div>')
            .css('width', pct + '%')
            .css('background-color', bondColor)
            .css('box-shadow', '0 0 6px ' + bondColor);
          $barBg.append($bar);

          $li.append($header, $barBg);
          $bondsList.append($li);
        });
      }

      /* 5. 战备部分渲染：源质余额范围0~100，战力公式 = 基础战力 * (源质余额 / 100) * (1 + 情绪波动 / 100) */
      const team = _.get(allVariables, 'stat_data.镜头人物', {});
      const $teamList = $('#team-list').empty();
      const memberKeys = Object.keys(team);
      if (memberKeys.length === 0) {
        $teamList.append($('<li class="empty-hint">').text('队伍整备中，无常驻出击成员'));
      } else {
        memberKeys.forEach(function(name) {
          const info = team[name] || {};
          const rawEnergy = typeof info['源质余额'] === 'number' ? info['源质余额'] : 0;
          const currentEnergy = clamp(rawEnergy, 0, 100);
          const rawMood = typeof info['情绪波动'] === 'number' ? info['情绪波动'] : 0;
          const mood = clamp(rawMood, 0, 100);
          const basePower = typeof info['基础战力'] === 'number' ? info['基础战力'] : 0;

          const calculatedPower = Math.round(basePower * (currentEnergy / 100) * (1 + mood / 100));

          const energyPct = currentEnergy;
          const halfWidthPct = (mood / 100) * 50;

          const $card = $('<li class="member-card"></li>');

          const $top = $('<div class="member-top"></div>');
          $top.append($('<span class="member-name"></span>').text(name));

          const $powerGroup = $('<div class="power-group"></div>');
          $powerGroup.append($('<span class="power-badge-base"></span>').text('基础战力 ' + basePower));
          $powerGroup.append($('<span class="power-badge-current"></span>').text('当前战力 ' + calculatedPower));
          $top.append($powerGroup);
          $card.append($top);

          const $energyWrap = $('<div></div>');
          const $energyLabel = $('<div class="sub-bar-label"><span>源质余额</span></div>');
          $energyLabel.append($('<span class="sub-bar-val"></span>').text(currentEnergy));
          const $energyBarBg = $('<div class="fluid-progress-bg"></div>');
          const $energyBar = $('<div class="fluid-progress-bar"></div>').css('width', energyPct + '%');
          $energyBarBg.append($energyBar);
          $energyWrap.append($energyLabel, $energyBarBg);
          $card.append($energyWrap);

          const $meterWrap = $('<div class="bipolar-meter-wrap"></div>');
          const $meterLabel = $('<div class="sub-bar-label"><span>情绪波动</span></div>');
          const $meterVal = $('<span class="sub-bar-val mood-val-strong"></span>')
            .text(mood)
            .css('color', getMoodTextColor(mood));
          $meterLabel.append($meterVal);

          const $track = $('<div class="bipolar-track"></div>');
          const $centerLine = $('<div class="bipolar-center-line"></div>');
          const $barLeft = $('<div class="bipolar-bar-left"></div>').css('width', halfWidthPct + '%');
          const $barRight = $('<div class="bipolar-bar-right"></div>').css('width', halfWidthPct + '%');

          $track.append($centerLine, $barLeft, $barRight);
          $meterWrap.append($meterLabel, $track);
          $card.append($meterWrap);

          $teamList.append($card);
        });
      }
    }

    function bindInteractions() {
      /* 点击页面其他空白处时，自动收起已打开的详情浮层 */
      $(document).on('click', function() {
        $('.asset-info-btn').removeClass('active');
      });
    }

    async function init() {
      await waitGlobalInitialized('Mvu');
      bindInteractions();
      populateCharacterData();
      eventOn(Mvu.events.VARIABLE_INITIALIZED, populateCharacterData);
      eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, populateCharacterData);
    }

    $(errorCatched(init));
  </script>
